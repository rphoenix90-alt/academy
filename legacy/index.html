<body class="overflow-hidden">

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ============================================================================
        // 🔥 원장님만의 Firebase 설정(Config)을 아래 중괄호 사이에 붙여넣으세요! 🔥
        // ============================================================================
        const myFirebaseConfig = {
            apiKey: "AIzaSyAmOskcfYATljxGin0nqJt0nf_k6B_7Zis",
            authDomain: "linkworks-hak.firebaseapp.com",
            projectId: "linkworks-hak",
            storageBucket: "linkworks-hak.firebasestorage.app",
            messagingSenderId: "86035968178",
            appId: "1:86035968178:web:b10c81716c0aff86be19ab"
        };
        // ============================================================================

        const isLocalEnvironment = typeof __firebase_config === 'undefined';
        const activeConfig = isLocalEnvironment && Object.keys(myFirebaseConfig).length > 0 ? myFirebaseConfig : (typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null);
        
        const app = activeConfig && Object.keys(activeConfig).length > 0 ? initializeApp(activeConfig) : null;
        const auth = app ? getAuth(app) : null;
        const db = app ? getFirestore(app) : null;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'my-local-academy-app';
        const isCloudActive = !!db; 
        
        const { useState, useEffect, useRef } = React;

        const Icon = ({ name, size = 16, className = '' }) => <i className={"fas fa-" + name + " " + className} style={{ fontSize: size }}></i>;
        const LayoutDashboard = () => <Icon name="th-large" />;
        const Users = () => <Icon name="users" />;
        const BookOpen = () => <Icon name="book-open" />;
        const CalendarDays = () => <Icon name="calendar-alt" />;
        const CreditCard = () => <Icon name="credit-card" />;
        const Search = () => <Icon name="search" />;
        const Plus = () => <Icon name="plus" />;
        const ArrowLeft = () => <Icon name="arrow-left" />;
        const ChevronRight = () => <Icon name="chevron-right" />;
        const ChevronLeft = () => <Icon name="chevron-left" />;
        const Save = () => <Icon name="save" />;
        const Printer = () => <Icon name="print" />;
        const Trash2 = () => <Icon name="trash-alt" />;
        const Edit = () => <Icon name="edit" />;
        const Clock = () => <Icon name="clock" />;
        const Download = () => <Icon name="download" />;
        const Upload = () => <Icon name="upload" />;
        const Building = () => <Icon name="building" />;
        const UserIcon = ({size=16}) => <Icon name="user" style={{ fontSize: size }} />;
        const LockIcon = () => <Icon name="lock" />;
        const XIcon = ({size=16}) => <Icon name="times" size={size} />;
        const Check = () => <Icon name="check" />;
        const History = () => <Icon name="history" />;

        // 애플 스타일 입력폼 및 라벨 클래스 통합
        const inputCls = "w-full text-[13px] bg-[#f5f5f7] border border-[rgba(0,0,0,0.05)] rounded-xl px-4 py-3 focus:bg-white focus:border-[#0066cc] focus:ring-2 focus:ring-[#0066cc]/20 outline-none transition-all duration-200 text-[#1d1d1f] font-medium";
        const labelCls = "block text-[11px] font-semibold text-[#86868b] uppercase tracking-wider mb-1.5 ml-1";
        const primaryBtnCls = "bg-[#0066cc] hover:bg-[#005bb5] text-white px-5 py-2.5 rounded-full font-semibold text-[13px] transition-all shadow-sm flex items-center justify-center gap-1.5";
        const secondaryBtnCls = "bg-[#f5f5f7] hover:bg-[#e8e8ed] text-[#1d1d1f] px-5 py-2.5 rounded-full font-semibold text-[13px] transition-all flex items-center justify-center gap-1.5";
        const subtleBtnCls = "bg-white border border-[rgba(0,0,0,0.05)] text-[#1d1d1f] hover:bg-[#f5f5f7] px-4 py-2 rounded-full font-medium text-xs transition-all shadow-sm flex items-center justify-center gap-1.5";

        const triggerNotification = (message, isError = false) => {
            const el = document.createElement('div');
            el.className = `fixed top-6 left-1/2 -translate-x-1/2 text-white px-6 py-3.5 rounded-full shadow-lg z-[100] transition-all duration-300 flex items-center gap-2.5 no-print font-medium text-sm apple-glass border-none ${isError ? 'bg-rose-500/90' : 'bg-[#1d1d1f]/90'}`;
            el.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-circle' : 'fa-check-circle'} ${isError ? 'text-white' : 'text-blue-400'}"></i> <span>${message}</span>`;
            document.body.appendChild(el);
            setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translate(-50%, -20px)'; setTimeout(() => document.body.removeChild(el), 300); }, 3000);
        };

        const generateId = () => Math.random().toString(36).substr(2, 9);
        const formatDate = (date) => {
            const d = new Date(date);
            let month = '' + (d.getMonth() + 1), day = '' + d.getDate(), year = d.getFullYear();
            if (month.length < 2) month = '0' + month;
            if (day.length < 2) day = '0' + day;
            return [year, month, day].join('-');
        };
        const getMonday = (d) => { const date = new Date(d); const day = date.getDay(); const diff = date.getDate() - day + (day === 0 ? -6 : 1); return new Date(date.setDate(diff)); };
        const getWeekDates = (startDate) => Array.from({ length: 7 }).map((_, i) => { const d = new Date(startDate); d.setDate(startDate.getDate() + i); return d; });

        const timeOptions = [];
        for (let i = 8; i <= 23; i++) {
            const hour = i.toString().padStart(2, '0');
            timeOptions.push(`${hour}:00`);
            timeOptions.push(`${hour}:30`);
        }
        timeOptions.push('24:00');

        const formatPhoneNumber = (value) => {
            if (!value) return '';
            value = value.replace(/[^0-9]/g, '');
            if (value.length < 4) return value;
            if (value.length < 8) return `${value.substr(0, 3)}-${value.substr(3)}`;
            return `${value.substr(0, 3)}-${value.substr(3, 4)}-${value.substr(7, 4)}`;
        };

        const ScoreGraph = ({ data, title, color }) => {
            if (!data || data.length === 0) return <div className="flex-1 bg-[#f5f5f7] rounded-3xl p-8 flex items-center justify-center text-[#86868b] text-sm font-medium">{title} 데이터가 없습니다.</div>;
            const sortedData = [...data].sort((a,b) => new Date(a.date) - new Date(b.date)).slice(-10);
            const maxScore = 100;
            const width = 400; const height = 160; const padding = 24;

            const points = sortedData.map((d, i) => {
                const x = padding + (i * (width - 2 * padding) / Math.max(1, sortedData.length - 1));
                const scoreNum = Number((String(d.score)).replace(/[^0-9.]/g,'')) || 0;
                const y = height - padding - (Math.min(maxScore, scoreNum) / maxScore) * (height - 2 * padding);
                return {x: isNaN(x) ? width/2 : x, y: isNaN(y) ? height/2 : y, label: d.exam, score: d.score, date: d.date};
            });

            const linePath = points.map((p, i) => (i === 0 ? `M ${p.x} ${p.y}` : `L ${p.x} ${p.y}`)).join(' ');

            return (
                <div className="flex-1 bg-white p-6 rounded-3xl border border-[rgba(0,0,0,0.05)] apple-shadow">
                    <h5 className="text-[13px] font-semibold text-[#1d1d1f] mb-6 flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-full" style={{backgroundColor: color}}></span> {title} 변동 추이</h5>
                    <svg viewBox={`0 0 ${width} ${height}`} className="w-full h-auto overflow-visible">
                        {[0, 25, 50, 75, 100].map(val => {
                            const y = height - padding - (val/100)*(height - 2*padding);
                            return <line key={val} x1={padding} y1={y} x2={width - padding} y2={y} stroke="rgba(0,0,0,0.05)" strokeWidth="1" />;
                        })}
                        <path d={linePath} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
                        {points.map((p, idx) => (
                            <g key={idx}>
                                <circle cx={p.x} cy={p.y} r="4.5" fill={color} stroke="#fff" strokeWidth="2" />
                                <text x={p.x} y={p.y - 14} fontSize="12" textAnchor="middle" fill="#1d1d1f" fontWeight="600">{p.score}</text>
                                <text x={p.x} y={height} fontSize="10" textAnchor="middle" fill="#86868b">{p.date.substring(5).replace('-','/')}</text>
                            </g>
                        ))}
                    </svg>
                </div>
            );
        };

        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) { return initialValue; }
            });
            const setValue = value => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) { console.error(error); }
            };
            return [storedValue, setValue];
        }

        const LoginView = ({ loginId, setLoginId, loginPw, setLoginPw, handleLogin, academyInfo, isSyncing }) => (
            <div className="flex h-screen bg-[#f5f5f7] items-center justify-center font-sans relative p-4 sm:p-0">
                <div className="bg-white p-10 sm:p-12 rounded-[2rem] apple-shadow border border-[rgba(0,0,0,0.05)] w-full max-w-[400px]">
                    <div className="text-center mb-10">
                        <div className="w-16 h-16 bg-[#0066cc] rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-sm relative">
                            <Icon name="link" className="text-white text-2xl"/>
                            {isSyncing && <span className="absolute -top-1 -right-1 w-3 h-3 bg-white rounded-full animate-ping"></span>}
                        </div>
                        <h1 className="text-2xl font-bold tracking-tight text-[#1d1d1f]">Link Works</h1>
                        <p className="text-xs font-semibold text-[#86868b] mt-2">
                            {academyInfo.name || 'Academy'} Management
                            {isCloudActive ? <span className="text-[#0066cc] ml-1">Cloud</span> : <span className="ml-1">Local</span>}
                        </p>
                    </div>
                    <form onSubmit={handleLogin} className="space-y-4">
                        <div className="relative">
                            <span className="absolute left-4 top-1/2 -translate-y-1/2 text-[#86868b]"><UserIcon size={14} /></span>
                            <input type="text" value={loginId} onChange={e=>setLoginId(e.target.value)} onInput={(e) => e.target.value = formatPhoneNumber(e.target.value)} className="w-full pl-11 pr-4 py-3.5 bg-[#f5f5f7] border border-[rgba(0,0,0,0.05)] rounded-xl focus:bg-white focus:border-[#0066cc] focus:ring-2 focus:ring-[#0066cc]/20 outline-none text-[13px] transition-all font-medium text-[#1d1d1f]" placeholder="연락처 입력" />
                        </div>
                        <div className="relative">
                            <span className="absolute left-4 top-1/2 -translate-y-1/2 text-[#86868b]"><LockIcon /></span>
                            <input type="password" value={loginPw} onChange={e=>setLoginPw(e.target.value)} className="w-full pl-11 pr-4 py-3.5 bg-[#f5f5f7] border border-[rgba(0,0,0,0.05)] rounded-xl focus:bg-white focus:border-[#0066cc] focus:ring-2 focus:ring-[#0066cc]/20 outline-none text-[13px] transition-all font-medium text-[#1d1d1f]" placeholder="비밀번호" />
                        </div>
                        <button type="submit" disabled={isSyncing} className={`w-full text-white font-semibold py-3.5 rounded-xl shadow-sm transition-all duration-300 mt-6 text-[13px] ${isSyncing ? 'bg-[#a1a1a6] cursor-not-allowed' : 'bg-[#0066cc] hover:bg-[#005bb5]'}`}>
                            {isSyncing ? '동기화 중...' : '로그인'}
                        </button>
                    </form>
                    <div className="mt-8 text-center text-[11px] font-medium text-[#86868b]">초기 비밀번호는 관리자에게 문의하세요.</div>
                </div>
            </div>
        );

        const DashboardView = ({ currentUser, isInstructor, getMyStudents, calcTeacherStats, students, dashboardMemos, setDashboardMemos, adminMemoMode, setAdminMemoMode }) => {
            const [weekStart, setWeekStart] = useState(getMonday(new Date()));
            
            const displayStudents = getMyStudents().filter(s => s.status !== '퇴원');
            const studentCount = displayStudents.length;
            const stats = calcTeacherStats().filter(t => t.role === '강사' || t.studentsCount > 0); 
            
            const displayTeacherStats = (isInstructor ? stats.filter(t => t.id === currentUser.id) : stats).map(t => {
                let mockMom = 0;
                if (t.studentsCount > 0) mockMom = Math.floor(((t.name.charCodeAt(0) + t.studentsCount) % 9) - 2); 
                return { ...t, momChange: mockMom };
            }).sort((a, b) => b.momChange - a.momChange);

            const pastMonthsStr = [];
            const pastMonthsLabels = [];
            for(let i = 4; i >= 0; i--) {
                const d = new Date(); d.setMonth(d.getMonth() - i);
                pastMonthsStr.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
                pastMonthsLabels.push(`${d.getMonth() + 1}월`);
            }

            const chartPoints = pastMonthsStr.map((monthStr, i) => {
                const activeCount = students.filter(s => {
                    const isEnrolled = s.enrollDate ? s.enrollDate.substring(0, 7) <= monthStr : true;
                    const notYetWithdrawn = (s.status === '퇴원' && s.withdrawDate) ? s.withdrawDate.substring(0, 7) >= monthStr : s.status !== '퇴원';
                    return isEnrolled && notYetWithdrawn;
                }).length;
                return { label: pastMonthsLabels[i], value: activeCount };
            });

            const maxValInPoints = Math.max(...chartPoints.map(p => p.value));
            const chartMaxY = Math.max(maxValInPoints + 5, 20); 
            
            const w = 400; const h = 160; const p = 24;
            const pts = chartPoints.map((d, i) => {
                const x = p + i * ((w - 2 * p) / (chartPoints.length - 1));
                const y = h - p - (d.value / chartMaxY) * (h - 2 * p);
                return { x: isNaN(x) ? w/2 : x, y: isNaN(y) ? h/2 : y, value: d.value, label: d.label };
            });

            let pathD = `M ${pts[0].x} ${pts[0].y}`;
            for (let i = 0; i < pts.length - 1; i++) {
                const xMid = (pts[i].x + pts[i + 1].x) / 2;
                pathD += ` C ${xMid} ${pts[i].y}, ${xMid} ${pts[i + 1].y}, ${pts[i + 1].x} ${pts[i + 1].y}`;
            }
            const areaD = `${pathD} L ${pts[pts.length - 1].x} ${h - p} L ${pts[0].x} ${h - p} Z`;

            return (
                <div className="space-y-6 animate-in fade-in duration-500 max-w-[1200px] mx-auto">
                    <div className="flex flex-col sm:flex-row sm:justify-between sm:items-end gap-3 mb-2">
                        <h2 className="text-2xl font-bold text-[#1d1d1f] tracking-tight">대시보드 {isInstructor && <span className="text-sm font-semibold text-[#0066cc] ml-2">({currentUser.name} 전용)</span>}</h2>
                        <div className="text-[13px] font-semibold text-[#86868b] flex items-center gap-2">
                            현재 {isInstructor ? '내 수강생' : '총 재원생'}: <span className="font-bold text-[#1d1d1f] text-lg">{studentCount}명</span>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
                        <div className="bg-white p-6 rounded-3xl apple-shadow border border-[rgba(0,0,0,0.05)] w-full flex flex-col transition-all">
                            <h3 className="text-[13px] font-semibold text-[#1d1d1f] mb-6 flex items-center gap-2">
                                <span className="w-2 h-2 rounded-full bg-[#0066cc]"></span> 월별 등록 추이
                            </h3>
                            <div className="flex-1 w-full relative flex items-center justify-center min-h-[200px]">
                                <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-full overflow-visible">
                                    <defs>
                                        <linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#0066cc" stopOpacity="0.15" /><stop offset="100%" stopColor="#0066cc" stopOpacity="0" /></linearGradient>
                                    </defs>

                e.preventDefault();

                    updatedTuitionHistory = [...(std.tuitionHistory||[]), {id: generateId(), ...tData}];
                }
                const updatedStudent = {...std, tuitionHistory: updatedTuitionHistory};
                if(isCloudActive) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', std.id), updatedStudent);
                else setStudents(prev => prev.map(s => s.id === std.id ? updatedStudent : s));

                const history = [...(std.classHistory || [])];
                const activeIndex = history.findIndex(h => h.classId === classId && !h.dropDate);
                if (activeIndex !== -1) {

                    if (isCloudActive) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', std.id), updatedStudent);

                const history = [...(std.classHistory || [])];

                    history[idx][field] = value;
                    const updatedStudent = { ...std, classHistory: history };
                    if (isCloudActive) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', std.id), updatedStudent);

                                                                                />

                                                    std.tuitionHistory.sort((a,b) => new Date(b.payDate) - new Date(a.payDate)).map(t => (

                                                                    <button onClick={(e) => { e.stopPropagation(); deleteRecord('tuitionHistory', t.id); }} className="text-[#86868b] hover:text-[#ff3b30] lg:opacity-0 group-hover:opacity-100 transition-opacity p-1.5 bg-white rounded-md border border-[rgba(0,0,0,0.05)] shadow-sm"><Trash2 size={12}/></button>
                                                                </td>

                                                            {expandedTuitionId === t.id && (

                                                                            <div><span className="font-semibold uppercase tracking-widest mr-1">수단</span> <span className="text-[#1d1d1f]">{t.method}</span></div>
                                                                            <div><span className="font-semibold uppercase tracking-widest mr-1">일시</span> <span className="text-[#1d1d1f]">{t.payDate}</span></div>

        };

        const GeneralModal = ({ 
            modalState, closeModal, isCloudActive, db, appId, academyInfo, setAcademyInfo,
            instructors, setInstructors, students, setStudents, classes, setClasses,
            classSchedules, setClassSchedules, modalEnrolledStudents, setModalEnrolledStudents,
            modalStudentSearchTerm, setModalStudentSearchTerm, isWithdrawnStatus, setIsWithdrawnStatus,
            smsSelectedIds, setSmsSelectedIds, smsContent, setSmsContent, getMyStudents, textbooks, setTextbooks
        }) => {
            const { type, data } = modalState;
            const isEdit = !!data;
            const [classEnrollDate, setClassEnrollDate] = useState(() => formatDate(new Date()));

            const handlePhoneInput = (e) => { e.target.value = formatPhoneNumber(e.target.value); };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (type === 'sms') {
                    if (smsSelectedIds.length === 0) return triggerNotification('수신자를 선택해주세요.', true);
                    if (!smsContent.trim()) return triggerNotification('메시지 내용을 입력해주세요.', true);
                    triggerNotification(`${smsSelectedIds.length}건 발송 성공`);
                    closeModal();
                    return;
                }

                const fd = new FormData(e.target);
                const obj = Object.fromEntries(fd.entries());
                
                try {
                    if (type === 'instructor') {
                        obj.loginId = obj.phone; 
                        const targetId = isEdit ? data.id : generateId();
                        if(isCloudActive) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'instructors', targetId), {id: targetId, ...data, ...obj});
                        else {
                            if(isEdit) setInstructors(prev => prev.map(i => i.id === data.id ? {...i, ...obj} : i));
                            else setInstructors(prev => [...prev, {id: targetId, ...obj}]);
                        }
                    } 
                    else if (type === 'student') {
                        const targetId = isEdit ? data.id : generateId();
                        const baseData = isEdit ? data : { grades:[], counseling:[], tuitionHistory:[], memo:'', classHistory: [], cashReceipt: '', classIds: [] };
                        
                        if (obj.status !== '퇴원') {
                            obj.withdrawReason = '';
                            obj.withdrawDate = '';
                        }
                        
                        if(isCloudActive) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', targetId), {id: targetId, ...baseData, ...obj});
                        else {
                            if(isEdit) setStudents(prev => prev.map(i => i.id === data.id ? {...i, ...obj} : i));
                            else setStudents(prev => [...prev, {id: targetId, ...baseData, ...obj}]);
                        }
                    } 
                    else if (type === 'class') {
                        const teacherName = instructors.find(i => i.id === obj.teacherId)?.name || '미정';
                        const targetId = isEdit ? data.id : generateId();
                        
                        obj.schedules = classSchedules;
                        obj.time = classSchedules.map(s => `${s.days.join('/')} ${s.start}~${s.end}`).join('\n');
                        if (!obj.weeklySessions) obj.weeklySessions = classSchedules.reduce((acc, cur) => acc + cur.days.length, 0) || 1;

                        if(isCloudActive) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'classes', targetId), {id: targetId, ...data, ...obj, teacherName});
                        else {
                            if(isEdit) setClasses(prev => prev.map(i => i.id === data.id ? {...i, ...obj, teacherName} : i));
                            else setClasses(prev => [...prev, {id: targetId, ...obj, teacherName}]);
                        }

                        const classNameToSave = obj.name;
                        const enrollDateToSave = classEnrollDate;
                        const prevEnrolled = isEdit ? students.filter(s => (s.classIds || []).includes(targetId)).map(s => s.id) : [];
                        const toAdd = modalEnrolledStudents.filter(id => !prevEnrolled.includes(id));
                        const toRemove = prevEnrolled.filter(id => !modalEnrolledStudents.includes(id));

                        for (const sId of toAdd) {
                            const std = students.find(s => s.id === sId);
                            if (std) {
                                const newClassIds = [...(std.classIds || []), targetId];
                                const history = [...(std.classHistory || [])];
                                history.push({ id: generateId(), classId: targetId, className: classNameToSave, enrollDate: enrollDateToSave, dropDate: null });
                                const finalStd = { ...std, classIds: newClassIds, classHistory: history };
                                if (isCloudActive) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', sId), finalStd);
                                else setStudents(prev => prev.map(s => s.id === sId ? finalStd : s));
                            }
                        }

                        for (const sId of toRemove) {
                            const std = students.find(s => s.id === sId);
                            if (std) {
                                const newClassIds = (std.classIds || []).filter(id => id !== targetId);
                                const newCustomClassTuition = { ...(std.customClassTuition || {}) };
                                delete newCustomClassTuition[targetId];

                                const history = [...(std.classHistory || [])];
                                const activeRecordIndex = history.findIndex(h => h.classId === targetId && !h.dropDate);
                                if (activeRecordIndex !== -1) history[activeRecordIndex].dropDate = formatDate(new Date());
                                else history.push({ id: generateId(), classId: targetId, className: classNameToSave, enrollDate: '이전', dropDate: formatDate(new Date()) });

                                const finalStd = { ...std, classIds: newClassIds, customClassTuition: newCustomClassTuition, classHistory: history };
                                if (isCloudActive) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', sId), finalStd);
                                else setStudents(prev => prev.map(s => s.id === sId ? finalStd : s));
                            }
                        }
                    } else if (type === 'academyEdit') {
                        const updatedAcademy = { ...academyInfo, ...obj };
                        if(isCloudActive) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'academyInfo', 'main'), updatedAcademy);
                        else setAcademyInfo(updatedAcademy);

            const [smsContent, setSmsContent] = useState('');

            const fileInputRef = useRef(null);
            const backupInputRef = useRef(null);

            const isInstructor = currentUser?.role === '강사';

            useEffect(() => {
                if (currentUser) {
                    if (currentUser.role === '원장' || currentUser.role === '관리자') setAdminMemoMode('private');
                    else setAdminMemoMode('public');
                }
            }, [currentUser]);

            useEffect(() => {
                if (!auth) { setIsSyncing(false); return; }
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                        else await signInAnonymously(auth); 
                    } catch (e) {
                        console.error("Firebase auth Error:", e);
                        setIsSyncing(false);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, user => { setFbUser(user); if(!user) setIsSyncing(false); });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!db || !fbUser) { setIsSyncing(false); return; }
                const unsubAcademy = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'academyInfo', 'main'), (snap) => { if(snap.exists()) setAcademyInfo(snap.data()); }, console.error);
                const unsubInstructors = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'instructors'), (snap) => { const arr = []; snap.forEach(d => arr.push({id: d.id, ...d.data()})); setInstructors(arr); }, console.error);
                const unsubStudents = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'students'), (snap) => { const arr = []; snap.forEach(d => arr.push({id: d.id, ...d.data()})); setStudents(arr); }, console.error);
                const unsubClasses = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'classes'), (snap) => { const arr = []; snap.forEach(d => arr.push({id: d.id, ...d.data()})); setClasses(arr); }, console.error);
                const unsubTextbooks = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'textbooks'), (snap) => { const arr = []; snap.forEach(d => arr.push({id: d.id, ...d.data()})); setTextbooks(arr); }, console.error);
                const unsubMemos = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'memos', 'main'), (snap) => { if(snap.exists()) setDashboardMemos(snap.data()); }, console.error);
                const unsubSettlements = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'settlements', 'main'), (snap) => { if(snap.exists()) setSettlements(snap.data()); }, console.error);
                setIsSyncing(false);
                return () => { unsubAcademy(); unsubInstructors(); unsubStudents(); unsubClasses(); unsubTextbooks(); unsubMemos(); unsubSettlements(); };
            }, [db, fbUser]);

            useEffect(() => {
                if (!currentUser || students.length === 0 || !academyInfo) return;
                if (currentUser.role !== '원장' && currentUser.role !== '관리자') return;

                const now = new Date();
                const currentYear = now.getFullYear();
                const promotionTime = new Date(currentYear, 0, 1, 10, 0, 0); 
                const lastPromotionYear = academyInfo.lastPromotionYear || 0;

                if (now >= promotionTime && lastPromotionYear < currentYear) {
                    const runPromotion = async () => {
                        const updatedStudents = students.map(s => {
                            let newGrade = s.grade;
                            if (newGrade === '초1') newGrade = '초2';
                            else if (newGrade === '초2') newGrade = '초3';
                            else if (newGrade === '초3') newGrade = '초4';
                            else if (newGrade === '초4') newGrade = '초5';
                            else if (newGrade === '초5') newGrade = '초6';
                            else if (newGrade === '초6') newGrade = '중1';
                            else if (newGrade === '중1') newGrade = '중2';
                            else if (newGrade === '중2') newGrade = '중3';
                            else if (newGrade === '중3') newGrade = '고1';
                            else if (newGrade === '고1') newGrade = '고2';
                            else if (newGrade === '고2') newGrade = '고3';
                            else if (newGrade === '고3') newGrade = '졸업';
                            return { ...s, grade: newGrade };
                        });

                        const updatedAcademy = { ...academyInfo, lastPromotionYear: currentYear };
                        if (isCloudActive) {
                            try {
                                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'academyInfo', 'main'), updatedAcademy);
                                for (const s of updatedStudents) {
                                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', s.id), s);
                                }
                                triggerNotification(`전체 원생 학년 자동 진급 완료`);
                            } catch(e) { console.error(e); }
                        } else {
                            setAcademyInfo(updatedAcademy);
                            setStudents(updatedStudents);
                            triggerNotification(`전체 원생 학년 자동 진급 완료`);
                        }
                    };
                    runPromotion();
                }
            }, [currentUser, students, academyInfo, isCloudActive, db, appId]);

            const getMyClasses = () => isInstructor ? classes.filter(c => c.teacherId === currentUser.id) : classes;
            const getMyStudents = () => {
                if (!isInstructor) return students;
                const myClassIds = getMyClasses().map(c => c.id);
                return students.filter(s => s.classIds && s.classIds.some(id => myClassIds.includes(id)));
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (!loginId || !loginPw) return triggerNotification('정보를 모두 입력해주세요.', true);
                const cleanInputId = loginId.replace(/-/g, '');
                if (cleanInputId === '01038621442' && loginPw === '1057') {
                    setCurrentUser({ id: 'admin', role: '원장', name: 'Admin' });
                    triggerNotification('관리자 로그인');
                    return;
                }
                const foundUser = instructors.find(t => (t.loginId === loginId || (t.phone && t.phone.replace(/-/g, '') === cleanInputId)) && t.password === loginPw);
                if (foundUser) {
                    setCurrentUser({ id: foundUser.id, role: foundUser.role, name: foundUser.name });
                    if (foundUser.role === '강사' && activeTab === 'academy') setActiveTab('dashboard');
                    triggerNotification(`Welcome, ${foundUser.name}!`);
                } else {
                    triggerNotification('정보가 일치하지 않습니다.', true);
                }
            };

            const handlePrint = () => { setIsPrintMode(true); setTimeout(() => { window.print(); setIsPrintMode(false); }, 300); };

            const openModal = (type, data = null) => { 
                setModalState({ isOpen: true, type, data }); 
                if (type === 'student') setIsWithdrawnStatus(data?.status === '퇴원');
                if (type === 'class') {
                    if (data && data.schedules && data.schedules.length > 0) setClassSchedules(data.schedules);
                    else setClassSchedules([{ id: generateId(), days: [], start: '18:00', end: '20:00' }]);
                    
                    if (data && data.id) {
                        const enrolled = students.filter(s => (s.classIds || []).includes(data.id)).map(s => s.id);
                        setModalEnrolledStudents(enrolled);
                    } else setModalEnrolledStudents([]);
                    setModalStudentSearchTerm('');
                }
            };
            const closeModal = () => { setModalState({ isOpen: false, type: null, data: null }); };

            const deleteItem = async (type, id) => {
                if(!window.confirm('정말 삭제하시겠습니까?')) return;
                try {
                    if(type === 'instructor') {
                        if(isCloudActive) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'instructors', id));
                        else setInstructors(prev => prev.filter(i => i.id !== id));
                        classes.forEach(async c => {
                            if (c.teacherId === id) {
                                if(isCloudActive) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'classes', c.id), {...c, teacherId: null, teacherName: '미정'});
                                else setClasses(prev => prev.map(cl => cl.id === c.id ? {...cl, teacherId: null, teacherName: '미정'} : cl));
                            }
                        });
                    }
                    else if(type === 'student') {
                        if(isCloudActive) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id));
                        else setStudents(prev => prev.filter(i => i.id !== id));
                    }
                    else if(type === 'class') {
                        if(isCloudActive) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'classes', id));
                        else setClasses(prev => prev.filter(i => i.id !== id));
                        students.forEach(async s => {
                            if (s.classIds && s.classIds.includes(id)) {
                                const newClassIds = s.classIds.filter(cId => cId !== id);
                                if(isCloudActive) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', s.id), {...s, classIds: newClassIds});
                                else setStudents(prev => prev.map(st => st.id === s.id ? {...st, classIds: newClassIds} : st));
                            }
                        });
                    }
                    else if(type === 'textbook') {
                        if(isCloudActive) await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'textbooks', id));
                        else setTextbooks(prev => prev.filter(i => i.id !== id));
                    }
                    triggerNotification('삭제됨');
                } catch(e) { triggerNotification('오류 발생', true); }
            };

            const handleExcelUpload = async (e) => {
                const file = e.target.files[0];
                if(!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, {type:'binary'});
                        const data = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);
                        const newStudents = data.map(row => ({
                            id: generateId(), name: row['이름'] || '이름없음', gender: row['성별'] || '남', grade: row['학년'] || '',
                            school: row['학교'] || '', phone: row['학생연락처'] || '', parentPhone: row['학부모연락처'] || '', status: '재원',
                            enrollDate: formatDate(new Date()), classIds: [], grades: [], counseling: [], tuitionHistory: [], memo: '', classHistory: [], cashReceipt: ''
                        }));
                        if(isCloudActive) { for(const ns of newStudents) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', ns.id), ns); } 
                        else setStudents(prev => [...prev, ...newStudents]);
                        triggerNotification(`${newStudents.length}건 업로드 완료`);
                    } catch(err) { triggerNotification('업로드 오류', true); }
                    e.target.value = null;
                };
                reader.readAsBinaryString(file);
            };

            const downloadSampleExcel = () => {
                const sampleData = [{ '이름': '홍길동', '성별': '남', '학교': '한국고', '학년': '고1', '학생연락처': '010-1234-5678', '학부모연락처': '010-9876-5432' }];
                const ws = XLSX.utils.json_to_sheet(sampleData); const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "양식"); XLSX.writeFile(wb, "학생등록_양식.xlsx");
            };

            const handleBackupData = () => {
                const backupData = { academyInfo, instructors, students, classes, dashboardMemos, settlements, textbooks };
                const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `Backup_${formatDate(new Date())}.json`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
                triggerNotification('다운로드 됨');
            };

            const handleRestoreData = async (e) => {
                const file = e.target.files[0];
                if(!file) return;
                const reader = new FileReader();
                reader.onload = async (evt) => {
                    try {
                        const data = JSON.parse(evt.target.result);
                        if(isCloudActive) {
                            if(data.academyInfo) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'academyInfo', 'main'), data.academyInfo);
                            if(data.instructors) for(const item of data.instructors) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'instructors', item.id), item);
                            if(data.students) for(const item of data.students) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', item.id), item);
                            if(data.classes) for(const item of data.classes) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'classes', item.id), item);
                            if(data.textbooks) for(const item of data.textbooks) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'textbooks', item.id), item);
                            if(data.dashboardMemos) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'memos', 'main'), data.dashboardMemos);
                            if(data.settlements) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settlements', 'main'), data.settlements);
                            triggerNotification('Cloud 복원 완료');
                        } else {
                            if(data.academyInfo) setAcademyInfo(data.academyInfo);
                            if(data.instructors) setInstructors(data.instructors);
                            if(data.students) setStudents(data.students);
                            if(data.classes) setClasses(data.classes);
                            if(data.textbooks) setTextbooks(data.textbooks);
                            if(data.dashboardMemos) setDashboardMemos(data.dashboardMemos);
                            if(data.settlements) setSettlements(data.settlements);
                            triggerNotification('Local 복원 완료');
                        }
                    } catch(err) { triggerNotification('파일 오류', true); }
                    e.target.value = null;
                };
                reader.readAsText(file);
            };

            const calcTeacherStats = () => {
                return instructors.map(inst => {
                    const instClasses = classes.filter(c => c.teacherId === inst.id).map(c => c.id);
                    const studentCount = students.filter(s => s.status !== '퇴원' && s.classIds && s.classIds.some(cId => instClasses.includes(cId))).length;
                    return { ...inst, studentsCount: studentCount };
                });
            };

            const calcSettlementDetails = (teacherId, month) => {
                const tClasses = classes.filter(c => c.teacherId === teacherId);
                const tClassIds = tClasses.map(c => c.id);
                let details = [];
                let totalAmount = 0;

                students.forEach(std => {
                    if(!std.classIds) return;
                    const enrolledMyClasses = std.classIds.filter(id => tClassIds.includes(id));
                    if(enrolledMyClasses.length > 0) {
                        enrolledMyClasses.forEach(cId => {
                            const cls = tClasses.find(c => c.id === cId);
                            if(cls) {
                                const settlementKey = `${month}_${cId}_${std.id}`;
                                const override = settlements[settlementKey] || {};
                                const baseSessions = (cls.weeklySessions || 2) * 4;
                                const actualSessions = override.actualSessions !== undefined ? override.actualSessions : baseSessions;
                                const originalBasePrice = Number(cls.price || 0);
                                const customPrice = std.customClassTuition?.[cId];
                                const adjustedBasePrice = customPrice !== undefined && customPrice !== '' ? Number(customPrice) : originalBasePrice;
                                const isAdjusted = adjustedBasePrice !== originalBasePrice;
                                const autoPrice = baseSessions > 0 ? Math.floor(adjustedBasePrice * (actualSessions / baseSessions)) : adjustedBasePrice;
                                const finalPrice = override.finalPrice !== undefined ? override.finalPrice : autoPrice;
                                
                                details.push({
                                    id: settlementKey, studentId: std.id, classId: cId, studentName: std.name, school: std.school,
                                    gender: std.gender, className: cls.name, baseSessions, actualSessions, basePrice: adjustedBasePrice,
                                    originalBasePrice, finalPrice, reason: override.reason || '', isAdjusted
                                });
                                totalAmount += Number(finalPrice);
                            }
                        });
                    }
                });
                return { details, totalAmount };
            };

            const handleSessionChange = async (id, actualSessions) => {
                const newSettlements = {...settlements};
                if (!newSettlements[id]) newSettlements[id] = {};
                newSettlements[id].actualSessions = actualSessions;
                delete newSettlements[id].finalPrice;
                if(isCloudActive) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settlements', 'main'), newSettlements);
                else setSettlements(newSettlements);
            };

            const handleSettlementChange = async (id, field, value) => {
                const newSettlements = {...settlements, [id]: {...(settlements[id]||{}), [field]: value}};
                if(isCloudActive) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settlements', 'main'), newSettlements);
                else setSettlements(newSettlements);
            };

            if (!currentUser) return <LoginView loginId={loginId} setLoginId={setLoginId} loginPw={loginPw} setLoginPw={setLoginPw} handleLogin={handleLogin} academyInfo={academyInfo} isSyncing={isSyncing} />;

            const navItems = [
                { id:'dashboard', name:'Dashboard', icon: LayoutDashboard, roles: ['원장', '관리자', '강사'] }, 
                { id:'academy', name:'Academy', icon: Building, roles: ['원장', '관리자'] },
                { id:'students', name:'Students', icon: Users, roles: ['원장', '관리자', '강사'] }, 
                { id:'classes', name:'Classes & Books', icon: BookOpen, roles: ['원장', '관리자', '강사'] },
                { id:'timetable', name:'Timetable', icon: CalendarDays, roles: ['원장', '관리자', '강사'] },
                { id:'tuition', name:'Settlement', icon: CreditCard, roles: ['원장', '관리자', '강사'] }
            ];
            const visibleNavItems = navItems.filter(item => item.roles.includes(currentUser.role));

            return (
                <div className={"flex h-screen font-sans " + (isPrintMode ? 'print-mode bg-white' : 'bg-[#f5f5f7]')}>
                    {!isSyncing && !isCloudActive && currentUser && (
                        <div className="absolute top-0 left-0 w-full bg-[#1d1d1f] text-[#f5f5f7] text-center py-2 text-[10px] font-bold no-print z-50 flex items-center justify-center gap-2 shadow-sm tracking-widest uppercase">
                            <i className="fas fa-database text-[#86868b]"></i> Running in Local Storage Mode
                        </div>
                    )}
                    
                    <div className="lg:hidden fixed top-4 left-4 z-50 no-print">
                        <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="bg-white/80 backdrop-blur-md border border-[rgba(0,0,0,0.05)] text-[#1d1d1f] p-2.5 rounded-full shadow-sm focus:outline-none transition-all">
                            <Icon name={isSidebarOpen ? "times" : "bars"} size={16} />
                        </button>
                    </div>
                    
                    {isSidebarOpen && <div className="lg:hidden fixed inset-0 bg-[#1d1d1f]/20 backdrop-blur-sm z-40 transition-all" onClick={() => setIsSidebarOpen(false)}></div>}

                    <aside className={`w-64 bg-[#f5f5f7] border-r border-[rgba(0,0,0,0.05)] flex flex-col z-40 no-print shrink-0 transition-transform duration-500 fixed lg:relative h-full ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'}`}>
                        <div onClick={() => { setActiveTab('dashboard'); setIsSidebarOpen(false); }} className="p-8 pb-6 mt-10 lg:mt-0 cursor-pointer group">
                            <h1 className="text-[22px] font-bold flex items-center gap-3 tracking-tight text-[#1d1d1f] transition-colors">
                                <div className="w-8 h-8 rounded-xl bg-[#0066cc] flex items-center justify-center shadow-sm transition-colors"><Icon name="link" className="text-white text-sm"/></div>
                                Link Works
                            </h1>
                            <p className="text-[#86868b] font-bold text-[10px] mt-2.5 ml-11 tracking-widest uppercase">{academyInfo.name || 'Academy'}</p>
                        </div>

                        <nav className="flex-1 mt-2 px-5 space-y-1.5 overflow-y-auto custom-scrollbar pb-6">
                            {visibleNavItems.map(item => (
                                <button key={item.id} onClick={() => { setActiveTab(item.id); setIsSidebarOpen(false); }} className={`w-full flex items-center gap-3.5 px-4 py-3 rounded-xl text-[14px] transition-all duration-300 nav-btn ${activeTab === item.id ? 'active' : 'text-[#86868b] font-medium'}`}>
                                    <item.icon /> {item.name}
                                </button>
                            ))}
                        </nav>

                        <div className="p-5 border-t border-[rgba(0,0,0,0.05)]">
                            <div className="flex items-center gap-3 mb-4 px-2">
                                <div className="w-9 h-9 rounded-full bg-white border border-[rgba(0,0,0,0.05)] flex items-center justify-center text-[#86868b] shadow-sm"><UserIcon size={14}/></div>
                                <div>
                                    <p className="text-[13px] font-bold text-[#1d1d1f]">{currentUser.name}</p>
                                    <p className="text-[10px] text-[#86868b] font-bold uppercase tracking-widest mt-0.5">{currentUser.role}</p>
                                </div>
                            </div>
                            <button onClick={() => {setCurrentUser(null); setLoginId(''); setLoginPw('');}} className="w-full text-[11px] py-2.5 bg-white hover:bg-[#e8e8ed] border border-[rgba(0,0,0,0.05)] text-[#1d1d1f] rounded-xl transition-colors font-bold uppercase tracking-widest shadow-sm">Sign Out</button>
                        </div>
                    </aside>

                    <main className="flex-1 overflow-hidden flex flex-col relative w-full bg-white lg:rounded-l-[2rem] lg:border-l lg:border-y border-[rgba(0,0,0,0.05)] lg:my-2 shadow-[-10px_0_30px_rgba(0,0,0,0.02)]">
                        <div className="flex-1 overflow-auto custom-scrollbar w-full print-container px-4 py-20 lg:p-12">
                            {activeTab === 'dashboard' && <DashboardView currentUser={currentUser} isInstructor={isInstructor} getMyStudents={getMyStudents} calcTeacherStats={calcTeacherStats} students={students} dashboardMemos={dashboardMemos} setDashboardMemos={setDashboardMemos} adminMemoMode={adminMemoMode} setAdminMemoMode={setAdminMemoMode} />}
                            {activeTab === 'academy' && <AcademyView academyInfo={academyInfo} instructors={instructors} openModal={openModal} deleteItem={deleteItem} handleBackupData={handleBackupData} handleRestoreData={handleRestoreData} backupInputRef={backupInputRef} />}
                            {activeTab === 'students' && <StudentsView getMyStudents={getMyStudents} isInstructor={isInstructor} openModal={openModal} deleteItem={deleteItem} fileInputRef={fileInputRef} handleExcelUpload={handleExcelUpload} downloadSampleExcel={downloadSampleExcel} classes={classes} setDetailTab={setDetailTab} />}
                            {activeTab === 'classes' && <ClassesView getMyClasses={getMyClasses} isInstructor={isInstructor} openModal={openModal} deleteItem={deleteItem} students={students} setDetailTab={setDetailTab} textbooks={textbooks} />}
                            {activeTab === 'timetable' && <TimetableView getMyClasses={getMyClasses} students={students} isInstructor={isInstructor} academyInfo={academyInfo} currentUser={currentUser} openModal={openModal} handlePrint={handlePrint} isPrintMode={isPrintMode} setDetailTab={setDetailTab} />}
                            {activeTab === 'tuition' && <TuitionView currentUser={currentUser} isInstructor={isInstructor} instructors={instructors} calcSettlementDetails={calcSettlementDetails} calcTeacherStats={calcTeacherStats} handleSessionChange={handleSessionChange} handleSettlementChange={handleSettlementChange} handlePrint={handlePrint} isPrintMode={isPrintMode} settlements={settlements} openModal={openModal} setDetailTab={setDetailTab} />}
                        </div>
                    </main>

                    {modalState.isOpen && modalState.type === 'studentDetail' && (
                        <StudentDetailModal stdId={modalState.data} students={students} classes={classes} currentUser={currentUser} isInstructor={isInstructor} isCloudActive={isCloudActive} db={db} appId={appId} setStudents={setStudents} closeModal={closeModal} openModal={openModal} detailTab={detailTab} setDetailTab={setDetailTab} />
                    )}
                    
                    {modalState.isOpen && modalState.type !== 'studentDetail' && (
                        <GeneralModal 
                            modalState={modalState} closeModal={closeModal} isCloudActive={isCloudActive} db={db} appId={appId} 
                            academyInfo={academyInfo} setAcademyInfo={setAcademyInfo} instructors={instructors} setInstructors={setInstructors} 
                            students={students} setStudents={setStudents} classes={classes} setClasses={setClasses} classSchedules={classSchedules} 
                            setClassSchedules={setClassSchedules} modalEnrolledStudents={modalEnrolledStudents} setModalEnrolledStudents={setModalEnrolledStudents}
